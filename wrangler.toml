name = "beyin-duelleri"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled", "/d/*", "/g/*"]

[[d1_databases]]
binding = "DB"
database_name = "beyin"
database_id = "689bf0db-0d20-4be8-9923-ea0db972aa77"
migrations_dir = "migrations"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["15 * * * *"]

[vars]
# Leave empty to build duel links from the request's own origin; set it once a custom domain is attached.
SITE_ORIGIN = ""
